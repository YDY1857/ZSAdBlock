name: Build TransformDiagnostic.dylib

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build diagnostic dylib
        working-directory: TransformDiagnostic
        run: |
          chmod +x build.sh
          ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: TransformDiagnostic-dylib
          path: TransformDiagnostic/TransformDiagnostic.dylib
          if-no-files-found: error
