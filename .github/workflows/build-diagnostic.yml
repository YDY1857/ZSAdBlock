name: Build ZSAdBlock.dylib

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build dylib
        working-directory: ZSAdBlock
        run: |
          chmod +x build.sh
          ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ZSAdBlock-dylib
          path: ZSAdBlock/ZSAdBlock.dylib
          if-no-files-found: error
